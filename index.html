<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Dhawal Dutta</title>
    <style>
        /* Base page styling */
        body {
            background-color: #f2f2f4; /* Matches the soft off-white background */
            font-family: "Times New Roman", Times, serif; /* Elegant serif font */
            color: #111;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
                font-family: Garamond, serif; /* Change to Garamond */
        }

        /* Top Header / Name */
        header {
            text-align: center;
            margin-top: 4rem;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin: 0;
        }

        header h1 a {
            color: inherit;
            font-size: inherit;
            text-decoration: none;
        }

        /* The 3-Column Layout */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* Left space, Center image, Right space */
            align-items: center; /* Centers everything vertically */
            flex-grow: 1;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding-bottom: 4rem;
        }

        /* Navigation Links container */
        .nav-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5rem; /* Spacing between the links */
        }

        /* Individual Links */
        a {
            text-decoration: none;
            color: #111;
            font-size: 18px;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.5;
        }

        .right-nav {
            align-items: stretch;
            justify-self: center;
            transform: translateX(-2rem);
            width: 10rem;
        }

        .right-nav a {
            text-align: right;
        }

        /* Center Image Box */
        .image-container {
            padding: 0 3rem;
        }

        .image-container img {
            display: block;
            max-width: 700px; /* Adjust this to make the image larger or smaller */
            width: 100%;
            height: auto;
            border: 5px solid #000; /* The thick black border from the mockup */
        }

        /* Mobile Responsiveness (Stacks everything on small screens) */
        @media (max-width: 1024px) {
            .layout-grid {
                grid-template-columns: 1fr;
                gap: 4rem;
            }
            .nav-col {
                flex-direction: row;
                justify-content: center;
                gap: 2rem;
                flex-wrap: wrap;
            }
            .right-nav {
                transform: none;
                width: auto;
            }
            .right-nav a {
                text-align: center;
            }
            .papers-link {
                align-self: center;
            }
            header {
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><a href="index.html">Dhawal Dutta</a></h1>
    </header>

    <!-- Main Content Area -->
    <div class="layout-grid">
        
        <!-- Left Menu -->
        <div class="nav-col">
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </div>

        <!-- Center Image -->
        <div class="image-container">
            <img src="~902.jpg" alt="Featured Portfolio Image">
        </div>

        <!-- Right Menu -->
        <div class="nav-col right-nav">
            <a href="photo-work.html">photo work</a>
            <a href="video-work.html">video work</a>
            <a href="papers.html" class="papers-link">papers<br>and publications</a>
        </div>

    </div>

</body>
</html>
