<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Photo Work | Dhawal Dutta</title>
    <style>
        :root {
            --paper: #f2f2f4;
            --ink: #111;
            --line: #c9c9cc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: Garamond, serif;
            margin: 0;
            min-height: 100vh;
        }

        header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 3rem auto 0;
            max-width: 1120px;
            padding: 0 2rem;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        h1 a {
            color: inherit;
            font-size: inherit;
            text-decoration: none;
        }

        .home-link,
        nav a {
            color: var(--ink);
            font-size: 18px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .home-link:hover,
        nav a:hover {
            opacity: 0.5;
        }

        main {
            margin: 5rem auto 0;
            max-width: 1120px;
            padding: 0 2rem 5rem;
        }

        .page-intro {
            align-items: baseline;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            padding-bottom: 1rem;
        }

        .page-intro h2 {
            font-size: 18px;
            font-weight: normal;
        }

        .page-intro p {
            font-size: 18px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .project-card {
            margin: 0;
        }

        .project-card a {
            color: inherit;
            display: block;
            text-decoration: none;
        }

        .project-card img {
            aspect-ratio: 4 / 3;
            display: block;
            height: 100%;
            object-fit: cover;
            width: 100%;
        }

        .project-card figcaption {
            font-size: 18px;
            line-height: 1.35;
            padding-top: 1rem;
        }

        .loading-message {
            font-size: 18px;
            grid-column: 1 / -1;
        }

        nav {
            display: flex;
            gap: 2rem;
            margin-top: 5rem;
        }

        @media (max-width: 700px) {
            header {
                margin-top: 2rem;
                padding: 0 1.25rem;
            }

            main {
                margin-top: 3.5rem;
                padding: 0 1.25rem 3rem;
            }

            .page-intro {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.5rem;
            }

            .project-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1.5rem;
                margin-top: 2rem;
            }

            nav {
                flex-wrap: wrap;
                gap: 1.25rem;
                margin-top: 3rem;
            }
        }

        @media (max-width: 460px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">Dhawal Dutta</a></h1>
        <a class="home-link" href="index.html">home</a>
    </header>

    <main>
        <div class="page-intro">
            <h2>Photo Work</h2>
            <p>Selected photographs</p>
        </div>

        <section class="project-grid" id="project-grid" aria-label="Photo projects">
            <p class="loading-message">Loading projects...</p>
        </section>

        <nav aria-label="Portfolio sections">
            <a href="video-work.html">video work</a>
            <a href="papers.html">papers and publications</a>
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </nav>
    </main>

    <script>
        const projectGrid = document.querySelector('#project-grid');

        fetch('/api/projects')
            .then(response => response.json())
            .then(projects => {
                projectGrid.innerHTML = projects.map(project => `
                    <figure class="project-card">
                        <a href="project.html?project=${encodeURIComponent(project.slug)}">
                            <img src="${project.cover}" alt="Thumbnail for ${project.title}" loading="lazy" decoding="async">
                            <figcaption>${project.title}</figcaption>
                        </a>
                    </figure>
                `).join('');
            })
            .catch(() => {
                projectGrid.innerHTML = '<p class="loading-message">Projects could not be loaded. Start the local server and refresh.</p>';
            });
    </script>
</body>
</html>
