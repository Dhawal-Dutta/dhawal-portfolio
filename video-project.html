<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Project | Dhawal Dutta</title>
    <style>
        :root { --paper: #f2f2f4; --ink: #111; --line: #c9c9cc; }
        * { box-sizing: border-box; }
        body { background: var(--paper); color: var(--ink); font-family: Garamond, serif; margin: 0; }
        header { align-items: center; display: flex; justify-content: space-between; margin: 3rem auto 0; max-width: 1120px; padding: 0 2rem; }
        h1, h2, p { margin: 0; }
        h1 { font-size: 32px; font-weight: normal; letter-spacing: 0.5px; }
        h1 a, header > a, .back-link { color: inherit; font-size: 18px; text-decoration: none; }
        h1 a { font-size: inherit; }
        a:hover { opacity: 0.5; }
        main { margin: 5rem auto 0; max-width: 1120px; padding: 0 2rem 5rem; }
        .project-heading { align-items: baseline; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; padding-bottom: 1rem; }
        h2, .project-heading p, .loading-message { font-size: 18px; }
        h2 { font-weight: normal; }
        .video-list { display: grid; gap: 3rem; margin-top: 3rem; }
        .video-item { margin: 0; }
        .video-item video { display: block; max-width: 100%; width: 100%; }
        .video-item iframe { aspect-ratio: 16 / 9; border: 0; display: block; width: 100%; }
        .back-link { display: inline-block; margin-top: 4rem; }
        @media (max-width: 700px) {
            header { margin-top: 2rem; padding: 0 1.25rem; }
            main { margin-top: 3.5rem; padding: 0 1.25rem 3rem; }
            .project-heading { align-items: flex-start; flex-direction: column; gap: 0.5rem; }
            .video-list { margin-top: 2rem; }
        }
    </style>
</head>
<body>
    <header><h1><a href="index.html">Dhawal Dutta</a></h1><a href="index.html">home</a></header>
    <main>
        <div class="project-heading"><h2 id="project-title">Loading...</h2><p>Video project</p></div>
        <section class="video-list" id="video-list" aria-label="Video gallery"><p class="loading-message">Loading videos...</p></section>
        <a class="back-link" href="video-work.html">back to video work</a>
    </main>
    <script>
        const slug = new URLSearchParams(window.location.search).get('project');
        const title = document.querySelector('#project-title');
        const videoList = document.querySelector('#video-list');
        fetch(`/api/videos/${encodeURIComponent(slug || '')}`)
            .then(response => response.json())
            .then(project => {
                document.title = `${project.title} | Dhawal Dutta`;
                title.textContent = project.title;
                if (!project.videos.length) {
                    videoList.innerHTML = '<p class="loading-message">Add video files to this project folder.</p>';
                    return;
                }
                videoList.innerHTML = project.videos.map((video, index) => `
                    <figure class="video-item">
                        ${video.youtube
                            ? `<iframe src="https://www.youtube.com/embed/${video.youtube}" title="${project.title} video ${index + 1}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`
                            : `<video controls preload="metadata"><source src="${video.src}" type="${video.type}">Your browser does not support video playback.</video>`}
                    </figure>
                `).join('');
            })
            .catch(() => {
                title.textContent = 'Project not found';
                videoList.innerHTML = '<p class="loading-message">This video project could not be loaded.</p>';
            });
    </script>
</body>
</html>
