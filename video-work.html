<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Work | Dhawal Dutta</title>
    <style>
        :root { --paper: #f2f2f4; --ink: #111; --line: #c9c9cc; }
        * { box-sizing: border-box; }
        body { background: var(--paper); color: var(--ink); font-family: Garamond, serif; margin: 0; min-height: 100vh; }
        header { align-items: center; display: flex; justify-content: space-between; margin: 3rem auto 0; max-width: 1120px; padding: 0 2rem; }
        h1, h2, p { margin: 0; }
        h1 { font-size: 32px; font-weight: normal; letter-spacing: 0.5px; }
        h1 a, .home-link, nav a, .project-card a { color: inherit; text-decoration: none; }
        h1 a { font-size: inherit; }
        .home-link, nav a { font-size: 18px; transition: opacity 0.2s ease; }
        h1 a:hover, .home-link:hover, nav a:hover, .project-card a:hover { opacity: 0.5; }
        main { margin: 5rem auto 0; max-width: 1120px; padding: 0 2rem 5rem; }
        .page-intro { align-items: baseline; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; padding-bottom: 1rem; }
        .page-intro h2, .page-intro p, .project-card figcaption, .loading-message { font-size: 18px; }
        .page-intro h2 { font-weight: normal; }
        .project-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; margin-top: 3rem; }
        .project-card { margin: 0; }
        .project-card img { aspect-ratio: 16 / 10; display: block; object-fit: cover; width: 100%; }
        .project-card figcaption { line-height: 1.35; padding-top: 1rem; }
        .loading-message { grid-column: 1 / -1; }
        nav { display: flex; gap: 2rem; margin-top: 5rem; }
        @media (max-width: 700px) {
            header { margin-top: 2rem; padding: 0 1.25rem; }
            main { margin-top: 3.5rem; padding: 0 1.25rem 3rem; }
            .page-intro { align-items: flex-start; flex-direction: column; gap: 0.5rem; }
            .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; margin-top: 2rem; }
            nav { flex-wrap: wrap; gap: 1.25rem; margin-top: 3rem; }
        }
        @media (max-width: 460px) { .project-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">Dhawal Dutta</a></h1>
        <a class="home-link" href="index.html">home</a>
    </header>
    <main>
        <div class="page-intro"><h2>Video Work</h2><p>Selected moving images</p></div>
        <section class="project-grid" id="project-grid" aria-label="Video projects">
            <p class="loading-message">Loading projects...</p>
        </section>
        <nav aria-label="Portfolio sections">
            <a href="photo-work.html">photo work</a>
            <a href="papers.html">papers and publications</a>
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </nav>
    </main>
    <script>
        const projectGrid = document.querySelector('#project-grid');
        fetch('/api/videos')
            .then(response => response.json())
            .then(projects => {
                if (!projects.length) {
                    projectGrid.innerHTML = '<p class="loading-message">Add a folder inside video-projects to begin.</p>';
                    return;
                }
                projectGrid.innerHTML = projects.map(project => `
                    <figure class="project-card">
                        <a href="video-project.html?project=${encodeURIComponent(project.slug)}">
                            <img src="${project.cover}" alt="Thumbnail for ${project.title}">
                            <figcaption>${project.title}</figcaption>
                        </a>
                    </figure>
                `).join('');
            })
            .catch(() => {
                projectGrid.innerHTML = '<p class="loading-message">Video projects could not be loaded. Start the local server and refresh.</p>';
            });
    </script>
</body>
</html>
